[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "originspan-mcp"
version = "0.5.2rc2"
description = "Durable application discovery, scoped hybrid retrieval, SQL lineage and architecture over MCP"
authors = [{name = "Kunal Singh"}]
requires-python = ">=3.12"
readme = "README_PYPI.md"
keywords = ["mcp", "discovery", "lineage", "architecture", "offline"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Documentation"]
license = "Apache-2.0"
dependencies = ["mcp==2.3.0", "SQLAlchemy==2.0.49", "sqlglot==30.27.0", "tree-sitter==0.26.0", "tree-sitter-java==0.23.5", "tree-sitter-kotlin==1.1.0", "httpx==0.28.1", "PyJWT[crypto]==2.15.1", "PyYAML==6.0.3", "uvicorn==0.40.0"]

[project.urls]
Homepage = "https://github.com/kunaldrafts25/OriginSpan-MCP"
Repository = "https://github.com/kunaldrafts25/OriginSpan-MCP"
Issues = "https://github.com/kunaldrafts25/OriginSpan-MCP/issues"
Documentation = "https://github.com/kunaldrafts25/OriginSpan-MCP/blob/main/docs/PILOT-QUICKSTART.md"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6", "huggingface-hub>=0.28,<2"]
postgres = ["psycopg[binary]==3.3.3"]
test = ["pytest==8.4.2"]

[project.scripts]
originspan = "diamond_mcp.cli:main"
diamond = "diamond_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diamond_mcp = ["viewer/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
