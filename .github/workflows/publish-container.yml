name: Publish verified MCP container
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published application release to package
        required: true
        default: v0.5.2rc2
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact release wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          export RELEASE_REPO="$GITHUB_REPOSITORY"
          python scripts/prepare_pypi_release.py
          mkdir -p .container-build
          cp dist/*.whl .container-build/
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing image version
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image tag already exists; use a new application release version."
            exit 1
          fi
      - name: Build and verify before publication
        run: |
          docker build --file Dockerfile.package --build-arg "ORIGINSPAN_VERSION=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE" .
          python -m pip install mcp==2.3.0
          python scripts/verify_container.py --image "$IMAGE" --version "$VERSION" --output container-validation.json
      - name: Publish package
        run: |
          for attempt in 1 2 3; do
            if docker push "$IMAGE"; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Package access diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/users/$GITHUB_REPOSITORY_OWNER/packages/container/originspan-mcp" --jq '{name,visibility,html_url,repository: .repository.full_name}' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validation
          path: container-validation.json
          if-no-files-found: warn
