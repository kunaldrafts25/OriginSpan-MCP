# Example HTTPS edge. Supply customer certificates and the correct DNS name.
limit_req_zone $binary_remote_addr zone=diamond_clients:10m rate=10r/s;
upstream diamond_api { server api:8765; keepalive 32; }
server {
    listen 443 ssl;
    server_name discovery.example;
    ssl_certificate /etc/diamond/tls/fullchain.pem;
    ssl_certificate_key /etc/diamond/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        limit_req zone=diamond_clients burst=30 nodelay;
        proxy_pass http://diamond_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
