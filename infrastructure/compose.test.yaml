name: diamond-mcp-validation
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: ${DIAMOND_TEST_DB_PASSWORD:?Run scripts/setup_integration.py first}
      POSTGRES_DB: diamond
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DIAMOND_TEST_ADMIN_PASSWORD:?Run scripts/setup_integration.py first}
      DIAMOND_TEST_CLIENT_SECRET: ${DIAMOND_TEST_CLIENT_SECRET:?Run scripts/setup_integration.py first}
    ports: ["127.0.0.1:8890:8080"]
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/diamond-realm.json:ro"]
volumes:
  pgdata:
